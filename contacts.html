<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts | Outreach System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; }
        .header { background: linear-gradient(135deg, #075E54, #128C7E); color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .header h1 { font-size: 22px; }
        .header a { color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 8px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        
        .card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h3 { margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 11px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        tr:hover td { background: #f8fafc; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-active { background: #d1fae5; color: #065f46; }
        
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-bar input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 16px; padding: 25px; max-width: 500px; width: 90%; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 50px; font-size: 13px; z-index: 1001; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👥 Contact Management</h1>
        <div><a href="index.html">← Dashboard</a> <a href="proposals.html" style="margin-left: 10px;">📄 Proposals</a> <a href="send.html" style="margin-left: 10px;">📤 Send</a></div>
    </div>
    
    <div class="container">
        <div class="card">
            <h3>➕ Add New Contact</h3>
            <div class="form-grid">
                <div class="form-group"><label>Full Name *</label><input type="text" id="contactName" placeholder="Full name"></div>
                <div class="form-group"><label>Phone Number (WhatsApp)</label><input type="tel" id="contactPhone" placeholder="e.g., 233XXXXXXXXX"></div>
                <div class="form-group"><label>Email Address</label><input type="email" id="contactEmail" placeholder="email@example.com"></div>
                <div class="form-group"><label>Company</label><input type="text" id="contactCompany" placeholder="Company name"></div>
                <div class="form-group"><label>Notes</label><input type="text" id="contactNotes" placeholder="Additional notes"></div>
            </div>
            <div style="margin-top: 15px; text-align: right;">
                <button class="btn btn-primary" onclick="addContact()">➕ Add Contact</button>
                <button class="btn btn-warning" onclick="clearForm()">Clear</button>
            </div>
        </div>
        
        <div class="card">
            <h3>📋 Contact List</h3>
            <div class="filter-bar"><input type="text" id="searchInput" placeholder="🔍 Search by name, phone, or email..." onkeyup="filterContacts()"></div>
            <div style="overflow-x: auto;">
                <table id="contactsTable">
                    <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Company</th><th>Actions</th></tr></thead>
                    <tbody id="contactsBody"><tr><td colspan="5" style="text-align:center;">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="editModal" class="modal">
        <div class="modal-content"><h3>✏️ Edit Contact</h3><input type="hidden" id="editId">
            <div class="form-group"><label>Name</label><input type="text" id="editName"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="editPhone"></div>
            <div class="form-group"><label>Email</label><input type="email" id="editEmail"></div>
            <div class="form-group"><label>Company</label><input type="text" id="editCompany"></div>
            <div class="form-group"><label>Notes</label><input type="text" id="editNotes"></div>
            <div class="modal-buttons"><button class="btn btn-primary" onclick="updateContact()">Save</button><button class="btn btn-danger" onclick="closeEditModal()">Cancel</button></div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        const API_URL = '';
        let contacts = [];
        
        window.onload = async function() { await loadContacts(); };
        
        async function loadContacts() {
            try {
                const res = await fetch(API_URL + '/api/contacts');
                contacts = await res.json();
                renderContacts();
            } catch(e) { console.error(e); }
        }
        
        function renderContacts() {
            const tbody = document.getElementById('contactsBody');
            let filtered = [...contacts];
            const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
            if (search) filtered = filtered.filter(c => c.name?.toLowerCase().includes(search) || c.phone?.includes(search) || c.email?.toLowerCase().includes(search));
            
            if (filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No contacts found</td></tr>'; return; }
            
            let html = '';
            filtered.forEach(c => {
                html += `<tr>
                    <td><strong>${escapeHtml(c.name)}</strong><br><small style="color:#888;">${escapeHtml(c.notes || '')}</small></td>
                    <td>${c.phone ? '📱 ' + c.phone : '—'}</td>
                    <td>${c.email ? '✉️ ' + c.email : '—'}</td>
                    <td>${escapeHtml(c.company || '—')}</td>
                    <td><button class="btn btn-primary btn-sm" onclick="openEditModal('${c.id}')">✏️ Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteContact('${c.id}')">🗑 Delete</button></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }
        
        function filterContacts() { renderContacts(); }
        
        async function addContact() {
            const name = document.getElementById('contactName').value.trim();
            if (!name) { showToast('❌ Name is required'); return; }
            const newContact = { name, phone: document.getElementById('contactPhone').value, email: document.getElementById('contactEmail').value, company: document.getElementById('contactCompany').value, notes: document.getElementById('contactNotes').value, status: 'active' };
            const res = await fetch(API_URL + '/api/contacts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newContact) });
            if (res.ok) { await loadContacts(); clearForm(); showToast('✅ Contact added'); }
            else showToast('❌ Failed');
        }
        
        function clearForm() {
            document.getElementById('contactName').value = '';
            document.getElementById('contactPhone').value = '';
            document.getElementById('contactEmail').value = '';
            document.getElementById('contactCompany').value = '';
            document.getElementById('contactNotes').value = '';
        }
        
        function openEditModal(id) {
            const c = contacts.find(c => c.id === id);
            if (!c) return;
            document.getElementById('editId').value = c.id;
            document.getElementById('editName').value = c.name || '';
            document.getElementById('editPhone').value = c.phone || '';
            document.getElementById('editEmail').value = c.email || '';
            document.getElementById('editCompany').value = c.company || '';
            document.getElementById('editNotes').value = c.notes || '';
            document.getElementById('editModal').style.display = 'flex';
        }
        
        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
        
        async function updateContact() {
            const id = document.getElementById('editId').value;
            const updated = { id, name: document.getElementById('editName').value, phone: document.getElementById('editPhone').value, email: document.getElementById('editEmail').value, company: document.getElementById('editCompany').value, notes: document.getElementById('editNotes').value };
            const res = await fetch(API_URL + '/api/contacts/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updated) });
            if (res.ok) { await loadContacts(); closeEditModal(); showToast('✅ Contact updated'); }
        }
        
        async function deleteContact(id) {
            if (!confirm('Delete this contact?')) return;
            const res = await fetch(API_URL + '/api/contacts/' + id, { method: 'DELETE' });
            if (res.ok) { await loadContacts(); showToast('🗑 Contact deleted'); }
        }
        
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    </script>
</body>
</html>
