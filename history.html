<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send History | Outreach System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; }
        .header { background: linear-gradient(135deg, #075E54, #128C7E); color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .header h1 { font-size: 22px; }
        .header a { color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 8px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        
        .card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h3 { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        tr:hover td { background: #f8fafc; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-whatsapp { background: #e8f5e9; color: #25D366; }
        .badge-email { background: #fce8e6; color: #EA4335; }
        
        .btn { padding: 8px 16px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-bar input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .filter-bar select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 50px; font-size: 13px; z-index: 1001; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Send History</h1>
        <div><a href="index.html">← Dashboard</a> <a href="send.html" style="margin-left: 10px;">📤 Send New</a></div>
    </div>
    
    <div class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <h3 style="margin:0;">📋 Sent Messages History</h3>
                <button class="btn btn-danger" onclick="clearAllHistory()">🗑 Clear All History</button>
            </div>
            
            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search by contact name..." onkeyup="filterHistory()">
                <select id="methodFilter" onchange="filterHistory()">
                    <option value="all">All Methods</option>
                    <option value="whatsapp">WhatsApp</option>
                    <option value="email">Email</option>
                </select>
            </div>
            
            <div style="overflow-x: auto;">
                <table id="historyTable">
                    <thead><tr><th>Date & Time</th><th>Contact</th><th>Proposal</th><th>Method</th><th>Message Preview</th><th>Action</th></tr></thead>
                    <tbody id="historyBody"><tr><td colspan="6" style="text-align:center;">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        const API_URL = '';
        let history = [];
        
        window.onload = async function() { await loadHistory(); };
        
        async function loadHistory() {
            try {
                const res = await fetch(API_URL + '/api/history');
                history = await res.json();
                renderHistory();
            } catch(e) { console.error(e); }
        }
        
        function renderHistory() {
            let filtered = [...history];
            const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
            if (search) filtered = filtered.filter(h => h.contactName?.toLowerCase().includes(search));
            const methodFilter = document.getElementById('methodFilter')?.value || 'all';
            if (methodFilter !== 'all') filtered = filtered.filter(h => h.method === methodFilter);
            
            filtered.sort((a, b) => new Date(b.sentAt) - new Date(a.sentAt));
            
            const tbody = document.getElementById('historyBody');
            if (filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No history found</td></tr>'; return; }
            
            let html = '';
            filtered.forEach(h => {
                const badgeClass = h.method === 'whatsapp' ? 'badge-whatsapp' : 'badge-email';
                const badgeText = h.method === 'whatsapp' ? '💬 WhatsApp' : '📧 Email';
                const preview = (h.message || '').substring(0, 80) + ((h.message || '').length > 80 ? '...' : '');
                html += `<tr>
                    <td>${new Date(h.sentAt).toLocaleString()}</td>
                    <td><strong>${escapeHtml(h.contactName)}</strong><br><small>${h.contactPhone ? '📱 ' + h.contactPhone : ''} ${h.contactEmail ? '✉️ ' + h.contactEmail : ''}</small></td>
                    <td>${escapeHtml(h.proposalTitle)}</td>
                    <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                    <td>${escapeHtml(preview)}</td>
                    <td><button class="btn btn-danger" style="padding:5px 10px; font-size:11px;" onclick="deleteHistory('${h.id}')">🗑 Delete</button></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }
        
        function filterHistory() { renderHistory(); }
        
        async function deleteHistory(id) {
            if (!confirm('Delete this history record?')) return;
            const res = await fetch(API_URL + '/api/history/' + id, { method: 'DELETE' });
            if (res.ok) { await loadHistory(); showToast('🗑 Record deleted'); }
        }
        
        async function clearAllHistory() {
            if (!confirm('⚠️ DELETE ALL HISTORY? This cannot be undone!')) return;
            const res = await fetch(API_URL + '/api/history', { method: 'DELETE' });
            if (res.ok) { await loadHistory(); showToast('🗑 All history cleared'); }
        }
        
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    </script>
</body>
</html>
