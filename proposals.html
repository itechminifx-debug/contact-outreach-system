<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposals | Outreach System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; }
        .header { background: linear-gradient(135deg, #075E54, #128C7E); color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .header h1 { font-size: 22px; }
        .header a { color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 8px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        
        .card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h3 { margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group textarea { min-height: 150px; resize: vertical; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 11px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        tr:hover td { background: #f8fafc; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-active { background: #d1fae5; color: #065f46; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 16px; padding: 25px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 50px; font-size: 13px; z-index: 1001; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📄 Proposal Templates</h1>
        <div><a href="index.html">← Dashboard</a> <a href="contacts.html" style="margin-left: 10px;">👥 Contacts</a> <a href="send.html" style="margin-left: 10px;">📤 Send</a></div>
    </div>
    
    <div class="container">
        <div class="card">
            <h3>➕ Create New Proposal Template</h3>
            <div class="form-group"><label>Title *</label><input type="text" id="proposalTitle" placeholder="e.g., Web Development Proposal"></div>
            <div class="form-group"><label>Content / Message *</label><textarea id="proposalContent" placeholder="Write your business proposal here...&#10;&#10;Dear {name},&#10;&#10;We are pleased to present our business proposal..."></textarea></div>
            <div class="form-group"><label>Sender Name</label><input type="text" id="proposalSender" placeholder="Your name or company name"></div>
            <div style="text-align: right;"><button class="btn btn-primary" onclick="addProposal()">💾 Save Proposal</button> <button class="btn btn-warning" onclick="clearForm()">Clear</button></div>
        </div>
        
        <div class="card">
            <h3>📋 Saved Proposals</h3>
            <div style="overflow-x: auto;">
                <table id="proposalsTable">
                    <thead><tr><th>Title</th><th>Content Preview</th><th>Created</th><th>Actions</th></tr></thead>
                    <tbody id="proposalsBody"><tr><td colspan="4" style="text-align:center;">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="editModal" class="modal">
        <div class="modal-content"><h3>✏️ Edit Proposal</h3><input type="hidden" id="editId">
            <div class="form-group"><label>Title</label><input type="text" id="editTitle"></div>
            <div class="form-group"><label>Content</label><textarea id="editContent" rows="10"></textarea></div>
            <div class="form-group"><label>Sender Name</label><input type="text" id="editSender"></div>
            <div class="modal-buttons"><button class="btn btn-primary" onclick="updateProposal()">Save</button><button class="btn btn-danger" onclick="closeEditModal()">Cancel</button></div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        const API_URL = '';
        let proposals = [];
        
        window.onload = async function() { await loadProposals(); };
        
        async function loadProposals() {
            try {
                const res = await fetch(API_URL + '/api/proposals');
                proposals = await res.json();
                renderProposals();
            } catch(e) { console.error(e); }
        }
        
        function renderProposals() {
            const tbody = document.getElementById('proposalsBody');
            if (proposals.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No proposals yet</td></tr>'; return; }
            let html = '';
            proposals.forEach(p => {
                const preview = p.content?.substring(0, 100) + (p.content?.length > 100 ? '...' : '');
                html += `<tr>
                    <td><strong>${escapeHtml(p.title)}</strong><br><small style="color:#888;">by ${escapeHtml(p.senderName || 'Unknown')}</small></td>
                    <td>${escapeHtml(preview)}</td>
                    <td>${new Date(p.createdAt).toLocaleDateString()}</td>
                    <td><button class="btn btn-primary btn-sm" onclick="openEditModal('${p.id}')">✏️ Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteProposal('${p.id}')">🗑 Delete</button></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }
        
        async function addProposal() {
            const title = document.getElementById('proposalTitle').value.trim();
            const content = document.getElementById('proposalContent').value.trim();
            if (!title || !content) { showToast('❌ Title and content are required'); return; }
            const newProposal = { title, content, senderName: document.getElementById('proposalSender').value, status: 'active' };
            const res = await fetch(API_URL + '/api/proposals', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newProposal) });
            if (res.ok) { await loadProposals(); clearForm(); showToast('✅ Proposal saved'); }
            else showToast('❌ Failed');
        }
        
        function clearForm() {
            document.getElementById('proposalTitle').value = '';
            document.getElementById('proposalContent').value = '';
            document.getElementById('proposalSender').value = '';
        }
        
        function openEditModal(id) {
            const p = proposals.find(p => p.id === id);
            if (!p) return;
            document.getElementById('editId').value = p.id;
            document.getElementById('editTitle').value = p.title || '';
            document.getElementById('editContent').value = p.content || '';
            document.getElementById('editSender').value = p.senderName || '';
            document.getElementById('editModal').style.display = 'flex';
        }
        
        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
        
        async function updateProposal() {
            const id = document.getElementById('editId').value;
            const updated = { id, title: document.getElementById('editTitle').value, content: document.getElementById('editContent').value, senderName: document.getElementById('editSender').value };
            const res = await fetch(API_URL + '/api/proposals/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updated) });
            if (res.ok) { await loadProposals(); closeEditModal(); showToast('✅ Proposal updated'); }
        }
        
        async function deleteProposal(id) {
            if (!confirm('Delete this proposal?')) return;
            const res = await fetch(API_URL + '/api/proposals/' + id, { method: 'DELETE' });
            if (res.ok) { await loadProposals(); showToast('🗑 Proposal deleted'); }
        }
        
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    </script>
</body>
</html>
